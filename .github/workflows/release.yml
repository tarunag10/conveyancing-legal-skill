name: Build and publish release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm release tag matches package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate package and run tests
        env:
          PYTHONPATH: src
        run: |
          python -m conveyancing_skill.cli validate
          python -m unittest discover -s tests -v

      - name: Build and verify ZIP
        run: python tools/package_release.py --ref "$GITHUB_REF_NAME" --version "$VERSION" --output "dist/conveyancing-legal-skill-v${VERSION}.zip"

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip.sha256" \
              --clobber
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip" \
              "dist/conveyancing-legal-skill-v${VERSION}.zip.sha256" \
              --title "Conveyancing Legal Skill v${VERSION}" \
              --notes "Versioned source package for the England and Wales Conveyancing Legal Skill. The ZIP includes the repository licence and all platform adapters. Prior written permission is required for any use; commercial use requires separate prior written permission. Installation and software validation are not legal verification or professional approval. See README.md and docs/USE_PERMISSION.md."
          fi
