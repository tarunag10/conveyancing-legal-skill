name: Offline skill verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[documents]'
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m conveyancing_skill.cli validate
