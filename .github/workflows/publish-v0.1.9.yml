name: Publish requested v0.1.9 release
on:
  push:
    branches: [release/publish-v0.1.9]
    paths: [.github/workflows/publish-v0.1.9.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90e3441d75c2929e69f6058e30257719369a0339
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and run checks
        run: |
          python -m pip install -e '.[documents]'
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "0.1.9"
          python -m conveyancing_skill.cli validate
          python -m unittest discover -s tests -v
      - name: Build verified source archive
        run: python tools/package_release.py --ref 90e3441d75c2929e69f6058e30257719369a0339 --version 0.1.9 --output dist/conveyancing-legal-skill-v0.1.9.zip
      - name: Publish requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.9 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          gh release create v0.1.9 dist/conveyancing-legal-skill-v0.1.9.zip dist/conveyancing-legal-skill-v0.1.9.zip.sha256 --target 90e3441d75c2929e69f6058e30257719369a0339 --title "Conveyancing Legal Skill v0.1.9" --notes "Versioned source distribution. Prior written permission is required for any use; commercial use requires separate prior written permission. Automated checks do not constitute legal verification or professional approval. Legal-source review and fresh-host acceptance remain outstanding; see README.md and docs/USE_PERMISSION.md."
