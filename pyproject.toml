[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ew-conveyancing-legal-skill"
version = "0.1.0"
description = "Evidence-gated England and Wales conveyancing skill and deterministic CLI"
requires-python = ">=3.10"
license = {text = "Proprietary; prior written permission required for all use; commercial use requires separate prior written permission"}
authors = [{name = "Conveyancing Skill Maintainers"}]

[project.optional-dependencies]
documents = ["python-docx>=1.0", "pypdf>=4.0"]

[project.scripts]
conveyancing = "conveyancing_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
